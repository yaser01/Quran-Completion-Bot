services:
  quranbot_postgres:
    image: postgres:16-alpine
    container_name: quranbot_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: UTC
    volumes:
      - quranbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - quranbot_network

  quranbot_bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: quranbot_bot
    restart: unless-stopped
    depends_on:
      quranbot_postgres:
        condition: service_healthy
    env_file: .env
    environment:
      WEBHOOK_LISTEN_HOST: 0.0.0.0
      WEBHOOK_LISTEN_PORT: 8443
      DATABASE_URI: postgresql+asyncpg://${DATABASE_USER}:${DATABASE_PASSWORD}@quranbot_postgres:5432/${POSTGRES_DB}
      DATABASE_BACKUP_URI: http://quranbot_backup:8001/backup_database
      DB_HOST: quranbot_postgres
    volumes:
      - .:/app
      - "./Secret Files:/app/Secret Files:ro"
      - "./Resources:/app/Resources:ro"
      - "./logs:/app/logs"
      - quranbot_daily_page:/app/data
    ports:
      - "${WEBHOOK_LISTEN_PORT:-8443}:8443"
    networks:
      - quranbot_network

  quranbot_admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: quranbot_admin
    restart: unless-stopped
    depends_on:
      quranbot_postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URI: postgresql+asyncpg://${DATABASE_USER}:${DATABASE_PASSWORD}@quranbot_postgres:5432/${POSTGRES_DB}
    ports:
      - "${ADMIN_PORT:-8002}:8002"
    networks:
      - quranbot_network

  quranbot_backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: quranbot_backup
    restart: unless-stopped
    depends_on:
      quranbot_postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URI: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@quranbot_postgres:5432/${POSTGRES_DB}
    volumes:
      - "./Secret Files:/app/Secret Files:ro"
      - "./logs:/app/logs"
    networks:
      - quranbot_network

networks:
  quranbot_network:
    name: quranbot_network
    driver: bridge

volumes:
  quranbot_postgres_data:
    name: quranbot_postgres_data
  quranbot_daily_page:
    name: quranbot_daily_page
